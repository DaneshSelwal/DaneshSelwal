<rect x=".5" y=".5" width="899" height="75" rx="8" fill="#05070d" stroke="#00e5ff" stroke-opacity=".35"/>
<circle cx="410" cy="22" r="3.5" fill="#00e5ff" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="430" cy="22" r="3.5" fill="#ff3df2" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.25s" repeatCount="indefinite"/></circle><circle cx="450" cy="22" r="3.5" fill="#39ff88" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="470" cy="22" r="3.5" fill="#ffb84d" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.75s" repeatCount="indefinite"/></circle><circle cx="490" cy="22" r="3.5" fill="#00e5ff" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="1.0s" repeatCount="indefinite"/></circle>
